<style>
/* Presify page CSS: Home stats bento (st-) — from AD v4 (2026-11-23). Page-level HtmlEmbed. */
/* ============ 1 · STATS ============ */
/* A — proof ledger: the existing 5-column row, each figure gets a small diagram of the fact itself */
.st-a{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));margin-top:3.5rem;border-top:1px solid var(--line)}
.st-a-c{padding:1.75rem 1.5rem 0;border-left:1px solid var(--line);display:flex;flex-direction:column}
.st-a-c:first-child{border-left:0;padding-left:0}
.st-viz{height:4.5rem;display:flex;align-items:flex-end;margin-bottom:1.5rem;color:var(--ink)}
.st-num{font:600 clamp(2.5rem,2rem + 2vw,3.75rem)/1 var(--font--secondary);letter-spacing:-.04em;color:var(--ink)}
.st-unit{margin-top:.375rem;font:500 .9375rem/1.3 var(--font--secondary);color:var(--ink-2)}
.st-t{margin-top:1.25rem;font:600 1rem/1.35 var(--font--secondary);color:var(--ink)}
.st-d{margin-top:.375rem;font:400 .9375rem/1.5 var(--font--primary);color:var(--ink-2)}
.st-ruler{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;width:100%}
.st-ruler i{height:.5rem;background:var(--ink);border-radius:1px}
.st-ruler i:last-child{background:linear-gradient(90deg,var(--ink) 55%,transparent 55%);outline:1px solid var(--ink);outline-offset:-1px}
.st-ruler-l{display:flex;justify-content:space-between;margin-top:.5rem;font:400 .625rem/1 var(--font--mono);color:var(--ink-2)}
.st-chips{display:flex;flex-wrap:wrap;gap:.3125rem}
.st-chips span{font:500 .6875rem/1 var(--font--secondary);border:1px solid var(--line);color:var(--ink);border-radius:.25rem;padding:.3125rem .4375rem}
.st-mtbl{width:100%;font:400 .6875rem/1 var(--font--mono);border-collapse:collapse;color:var(--ink)}
.st-mtbl td{padding:.25rem 0;border-bottom:1px solid var(--line)}
.st-mtbl td+td{text-align:right}
.st-mtbl tr:first-child td{border-top:1px solid var(--line)}
.st-dots{display:flex;gap:1rem;align-items:flex-end}
.st-dots>div{display:grid;gap:.25rem;justify-items:center;font:400 .625rem/1 var(--font--mono);color:var(--ink-2)}
.st-dots i{display:block;width:.625rem;height:.625rem;border-radius:2px;background:var(--ink)}
.st-types{display:flex;gap:.875rem}
.st-types span{display:grid;gap:.375rem;justify-items:center;font:400 .625rem/1 var(--font--mono);color:var(--ink-2)}
.st-types svg,.st-ic{width:1.75rem;height:1.75rem;fill:none;stroke:var(--ink);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}

/* B — bento: one product-proof tile (dark UI) + four fact tiles */
.st-b{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:1rem;margin-top:3.5rem}
.st-tile{background:var(--neutral--0);border:1px solid var(--line);border-radius:.875rem;padding:1.75rem;display:flex;flex-direction:column;min-width:0}
.th:not([data-rc-theme="light"]) .st-tile{background:var(--neutral--900)}
.st-tile.is-proof{grid-column:span 7;grid-row:span 2;background:var(--neutral--950);border-color:var(--neutral--950);color:#fff}
.st-tile.is-proof .st-num,.st-tile.is-proof .st-t{color:#fff}
.st-tile.is-proof .st-d{color:var(--neutral--400)}
.st-tile.is-r{grid-column:span 5}
.st-tile.is-h{grid-column:span 6}
.st-row{display:flex;justify-content:space-between;align-items:flex-start;gap:1.5rem}
.st-tile .st-viz{height:auto;margin:0}
.st-tile .st-t{margin-top:1rem}
.st-proof-ui{margin-top:1.5rem;flex:1;display:flex;flex-direction:column;gap:.75rem}
.st-proof-ui .ui{flex:1}
.st-segs{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-top:1.25rem}
.st-segs b{display:block;font:600 .75rem/1.3 var(--font--secondary);color:var(--ink);padding-bottom:.5rem;border-bottom:1px solid var(--line);margin-bottom:.5rem}
.st-segs a{display:block;font:400 .8125rem/1.35 var(--font--primary);color:var(--ink-2);padding:.25rem 0}
.st-segs a:hover{color:var(--ink)}
.st-types.is-lg{gap:0;margin-top:1.25rem;display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line)}
.st-types.is-lg span{justify-items:start;padding:1rem 0 0;font:500 .8125rem/1.2 var(--font--secondary);color:var(--ink);gap:.625rem}
.st-foot{margin-top:2.5rem}

@media (max-width:991px){
  .st-a{grid-template-columns:repeat(2,minmax(0,1fr))}
  .st-a-c{border-left:0;padding-left:0;padding-bottom:1.75rem;border-bottom:1px solid var(--line)}
  .st-a-c:nth-child(2n){padding-left:1.5rem;border-left:1px solid var(--line)}
  .st-tile.is-proof,.st-tile.is-r,.st-tile.is-h{grid-column:1/-1;grid-row:auto}
  .st-b{grid-template-columns:repeat(2,minmax(0,1fr))}
  .st-tile.is-r{grid-column:span 1}
}
@media (max-width:767px){
  .st-a{grid-template-columns:1fr}
  .st-a-c,.st-a-c:nth-child(2n){padding-left:0;border-left:0}
  .st-b{grid-template-columns:1fr}
  .st-tile.is-r{grid-column:1/-1}
  .st-tile{padding:1.25rem}
  .st-segs{grid-template-columns:1fr;gap:.75rem}
  .st-types.is-lg{grid-template-columns:repeat(2,1fr);row-gap:.5rem}
}
.st-tile.is-r>:last-child{margin-top:auto!important;padding-top:1.5rem}
@media (max-width:991px){.tour-grid{grid-template-columns:1fr}}
</style>
