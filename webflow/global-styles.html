<style>
/* ============================================
   PRESIFY — WEBFLOW GLOBAL CSS  P1.6 (2026-11-18)
   Base = RC Structure v1.1 (+ srgb fix, margin reset). Presify block below.
   Source: Roicool/presify webflow/global-styles.html — keep identical to the embed.
   ============================================ */

:root {
  /* RC Structure gradient tokens (bg-gradient-* / text-gradient-* classes); transparency mixes in srgb */
  --gradient--brand:        linear-gradient(135deg, var(--brand-primary--500), var(--brand-secondary--500));
  --gradient--brand-hover:  linear-gradient(135deg, var(--brand-primary--600), var(--brand-secondary--600));
  --gradient--brand-soft:   linear-gradient(135deg, var(--brand-primary--100), var(--brand-secondary--100));
  --gradient--brand-deep:   linear-gradient(135deg, var(--brand-primary--800), var(--brand-secondary--900));
  --gradient--ink:          linear-gradient(180deg, var(--neutral--900), var(--neutral--950));
  --gradient--ink-flat:     linear-gradient(180deg, var(--neutral--950), var(--neutral--900));
  --gradient--text-brand:   linear-gradient(90deg, var(--brand-primary--500), var(--brand-secondary--500));
  --gradient--text-ink:     linear-gradient(90deg, var(--neutral--950), var(--neutral--600));
  --gradient--text-mist:    linear-gradient(90deg, var(--neutral--0), var(--neutral--400));
  --gradient--border-brand: linear-gradient(135deg, var(--brand-primary--500), var(--brand-secondary--500));
  --gradient--border-shine: linear-gradient(135deg, var(--neutral--0), var(--neutral--300), var(--neutral--0));
  --gradient--hero-dawn:    radial-gradient(120% 80% at 50% 0%, var(--brand-primary--100), var(--neutral--0) 70%);
  --gradient--hero-dusk:    radial-gradient(120% 80% at 50% 0%, var(--brand-secondary--800), var(--neutral--950) 70%);
  --gradient--hero-halo:    radial-gradient(60% 50% at 50% 0%, color-mix(in srgb, var(--brand-primary--300) 60%, transparent), transparent 70%);
  --gradient--glow-warm:    radial-gradient(50% 50% at 50% 50%, color-mix(in srgb, var(--brand-primary--300) 50%, transparent), transparent 70%);
  --gradient--glow-cool:    radial-gradient(50% 50% at 50% 50%, color-mix(in srgb, var(--brand-secondary--300) 50%, transparent), transparent 70%);
  --gradient--wash-warm:    linear-gradient(180deg, var(--brand-primary--100), var(--neutral--0));
  --gradient--wash-cool:    linear-gradient(180deg, var(--brand-secondary--100), var(--neutral--0));
  --gradient--wash-horizon: linear-gradient(180deg, var(--neutral--0), var(--neutral--100));
  --gradient--wash-rise:    linear-gradient(0deg, var(--brand-primary--100), transparent);
  --gradient--scrim-top:    linear-gradient(180deg, color-mix(in srgb, var(--neutral--950) 70%, transparent), transparent);
  --gradient--scrim-bottom: linear-gradient(0deg, color-mix(in srgb, var(--neutral--950) 70%, transparent), transparent);
  --gradient--scrim-full:   linear-gradient(0deg, color-mix(in srgb, var(--neutral--950) 60%, transparent), color-mix(in srgb, var(--neutral--950) 60%, transparent));
  /* Presify */
  --gradient--highlight:    linear-gradient(90deg, #c33a20 0%, #ee5a2a 100%);
  --gradient--glow:         radial-gradient(closest-side, rgba(240,99,30,.55), rgba(167,63,24,.22) 45%, rgba(65,24,18,0) 100%);
  --gradient--mega-foot:    linear-gradient(90deg, rgba(195,58,32,.22), rgba(238,90,42,.06));
  --shadow--btn:            0 8px 24px -10px rgba(231,67,30,.7);
  --shadow--btn-hover:      0 10px 32px -8px rgba(240,99,30,.8);
  --shadow--card-hover:     0 18px 48px -24px rgba(240,99,30,.55);
}

/* ── MARGIN RESET (Webflow defaults) ── */
h1, h2, h3, h4, h5, h6, p, figure, blockquote, ul, ol { margin: 0; }

/* ── BASE ── */
body { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; text-rendering: optimizeLegibility; -webkit-text-size-adjust: 100%; }
* { -webkit-tap-highlight-color: transparent; }
html { scroll-behavior: smooth; scrollbar-gutter: stable; }
img, video { display: block; max-width: 100%; }
p, li, blockquote, figcaption, h1, h2, h3, h4, h5, h6 { overflow-wrap: break-word; }
:focus:not(:focus-visible) { outline: none; }
:focus-visible { outline: 2px solid var(--brand-primary--400); outline-offset: 3px; border-radius: 2px; }
::selection { background-color: var(--brand-primary--600); color: #fff; }
::placeholder { opacity: 1; color: var(--neutral--500); }
button, [role="button"], label[for], select, summary { cursor: pointer; }
svg:not([fill]) { fill: currentColor; }

/* ============ PRESIFY ============ */

/* Highlight heading: thin line (Raleway 300) + bold line in the gradient bar.
   Markup: h2.h2-style > span.hl-row "thin" + span.hl-row > span.hl "bold". Max one bar per viewport. */
.hl-row { display: block; }
.hl { display: inline; font-family: var(--font--secondary); font-weight: 700; letter-spacing: -.02em; color: #fff;
  background-image: var(--gradient--highlight); padding: 0 .16em; line-height: 1.3;
  -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.hl-strong { font-family: var(--font--secondary); font-weight: 700; letter-spacing: -.02em; }

/* Buttons: hover/transition + chevron slide (layout/colour live in the Webflow btn classes) */
.btn { transition: background-color .2s, border-color .2s, color .2s, box-shadow .2s; }
.btn .btn-chev { transition: transform .2s; }
.btn:hover .btn-chev { transform: translateX(3px); }
.btn.is-primary { box-shadow: var(--shadow--btn); }
.btn.is-primary:hover { box-shadow: var(--shadow--btn-hover); }

/* Decorative backgrounds (aria-hidden divs) */
.deco-glow-wrap { position: relative; isolation: isolate; overflow: hidden; }
.deco-glow { position: absolute; z-index: -1; pointer-events: none; width: 70rem; height: 70rem; border-radius: 50%; background: var(--gradient--glow); }
.deco-dots { position: absolute; inset: 0; z-index: -2; pointer-events: none;
  background-image: radial-gradient(rgba(231,67,30,.35) 1px, transparent 1.4px); background-size: 22px 22px;
  -webkit-mask-image: radial-gradient(ellipse at 70% 40%, #000 0%, transparent 70%); mask-image: radial-gradient(ellipse at 70% 40%, #000 0%, transparent 70%); }
.deco-gridlines { position: absolute; inset: 0; z-index: -2; pointer-events: none;
  background-image: linear-gradient(rgba(231,67,30,.16) 1px, transparent 1px), linear-gradient(90deg, rgba(231,67,30,.16) 1px, transparent 1px); background-size: 72px 72px;
  -webkit-mask-image: linear-gradient(180deg, #000 0%, transparent 75%); mask-image: linear-gradient(180deg, #000 0%, transparent 75%); }
.deco-neon { position: absolute; z-index: -1; pointer-events: none; color: var(--accent--glow-core);
  filter: drop-shadow(0 0 6px rgba(240,99,30,.9)) drop-shadow(0 0 22px rgba(240,99,30,.6)); }

/* Glass card (Amperon stats) */
.glass { background: rgba(22,22,22,.55); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }

/* Card hover (whole card is a link) */
.card-link { transition: border-color .2s, box-shadow .2s, transform .2s; }
.card-link:hover { border-color: rgba(231,67,30,.55); box-shadow: var(--shadow--card-hover); transform: translateY(-2px); }

/* Scroll-snap carousel (JS-free) */
.snap-row { display: grid; grid-auto-flow: column; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
.snap-row > * { scroll-snap-align: start; }
.snap-row::-webkit-scrollbar { display: none; }

/* Native details (FAQ + mobile accordion) */
details > summary { list-style: none; }
details > summary::-webkit-details-marker { display: none; }
details[open] > summary .caret { transform: rotate(180deg); }
.caret { transition: transform .2s; }


/* ===== Nav + Footer (Builder A) ===== */
/* Bar: translucent + blur (rgba + backdrop-filter) */
.nav-bar { background: rgba(12,12,12,.78); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
.nav-inner { position: relative; }

/* Links */
.nav-link:hover, .nav-item:focus-within > .nav-link { background: rgba(255,255,255,.06); color: var(--neutral--0); }
.nav-link.w--current { color: var(--neutral--0); }
.nav-link.w--current::after { content: ""; position: absolute; left: 1rem; right: 1rem; bottom: .25rem; height: 2px; border-radius: 2px;
  background: var(--brand-primary--500); box-shadow: 0 0 10px rgba(240,99,30,.8); }
.nav-caret { transition: transform .2s; }
.nav-item:hover .nav-caret, .nav-item:focus-within .nav-caret { transform: rotate(180deg); }

/* Panels (JS-free). Mega is positioned against the bar container (centred, never wider than the container → no overflow at 992). */
.nav-item:has(> .nav-panel.is-mega) { position: static; }
.nav-panel { position: absolute; top: 100%; z-index: 60; opacity: 0; visibility: hidden; transition: opacity .2s, transform .2s, visibility .2s; }
.nav-panel::before { content: ""; position: absolute; left: 0; right: 0; top: -14px; height: 14px; } /* hover bridge */
.nav-panel.is-mega::before { top: -24px; height: 24px; }
.nav-panel.is-mega { left: 50%; width: min(64rem, 100%); transform: translate(-50%, 8px); box-shadow: 0 40px 80px -24px rgba(0,0,0,.8), 0 0 0 1px rgba(231,67,30,.06); }
.nav-panel.is-drop { left: 0; min-width: 15rem; padding: .5rem; transform: translateY(8px); }
.nav-item:hover > .nav-panel, .nav-item:focus-within > .nav-panel { opacity: 1; visibility: visible; }
.nav-item:hover > .nav-panel.is-mega, .nav-item:focus-within > .nav-panel.is-mega { transform: translate(-50%, 0); }
.nav-item:hover > .nav-panel.is-drop, .nav-item:focus-within > .nav-panel.is-drop { transform: none; }

/* Mega internals */
.nav-icon { border: 1px solid rgba(231,67,30,.4); background: rgba(231,67,30,.08); }
.nav-mega-link:hover { background: rgba(255,255,255,.05); }
.nav-mega-link-title::before { content: ""; width: .375rem; height: .375rem; border-radius: 2px; background: var(--brand-primary--500); transform: rotate(45deg); flex: none; }
.nav-mega-foot { background: linear-gradient(90deg, rgba(195,58,32,.22), rgba(238,90,42,.06)); }

/* Mobile menu: native popover (button[popovertarget] → div#nav-mobile[popover]) */
.nav-mobile { position: fixed; inset: 5.5rem var(--view--px) auto var(--view--px); margin: 0; width: auto; max-height: calc(100svh - 6.5rem); overflow: auto; color: var(--neutral--0); }
.nav-mobile::backdrop { background: rgba(0,0,0,.5); }
.nav-mob-sublink:hover { color: var(--neutral--0); }
@media (min-width: 992px) { .nav-mobile { display: none !important; } }

/* Footer */
.site-footer-link:hover { color: var(--neutral--0); text-decoration: underline; text-decoration-color: var(--brand-primary--500); text-underline-offset: 4px; }
.site-footer-social { transition: color .2s, border-color .2s; }
.site-footer-social:hover { color: var(--neutral--0); border-color: var(--brand-primary--500); }
.nav-mobile:not(:popover-open) { display: none; }

/* ===== Home: hero band / text (Builder D) ===== */
.hb-tint { background: linear-gradient(90deg, rgba(12,12,12,.92) 0%, rgba(60,17,9,.55) 45%, rgba(12,12,12,.25) 70%, rgba(12,12,12,.7) 100%); }
.hb-hex { background: linear-gradient(180deg, rgba(231,67,30,.18), rgba(231,67,30,.04)); clip-path: polygon(25% 0,100% 0,75% 100%,0 100%); border-left: 1px solid rgba(240,99,30,.6); }
.hb-device-img { border-radius: 1rem; box-shadow: 0 50px 100px -30px rgba(0,0,0,.9), 0 0 0 1px rgba(255,255,255,.08); }
.hb-device-base { background: linear-gradient(180deg, #e7431e, #922a14); box-shadow: 0 18px 40px -10px rgba(231,67,30,.6); }
.hb-waves svg { width: 100%; height: 100%; display: block; }
@media (max-width: 767px) { .home-hero-grid .btn-group { flex-direction: column; align-items: stretch; } .home-hero-grid .btn-group .btn { width: 100%; justify-content: center; } }

/* ===== Segment hubs (Builder C) ===== */
.hub-hero { isolation: isolate; }
.hub-hero::before { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(90deg, rgba(12,12,12,.94) 0%, rgba(12,12,12,.75) 45%, rgba(12,12,12,.2) 100%), linear-gradient(0deg, #0c0c0c 0%, transparent 40%); }
.pill::before { content: ""; width: .375rem; height: .375rem; border-radius: 50%; background: var(--brand-primary--500); flex: none; }
.crumbs a { text-decoration: none; }
.crumbs a:hover { color: var(--brand-primary--500); text-decoration: underline; text-underline-offset: 3px; }
.pcard-media { background: radial-gradient(120% 90% at 80% 0%, rgba(231,67,30,.28), transparent 60%), linear-gradient(160deg, #24140f, #141414); }
.aud { position: relative; overflow: hidden; isolation: isolate; background: linear-gradient(160deg, #1b1310 0%, #111 60%); }
.aud::after { content: ""; position: absolute; right: -6rem; top: -6rem; width: 18rem; height: 18rem; z-index: -1; background: radial-gradient(closest-side, rgba(240,99,30,.4), transparent); pointer-events: none; }
.bar-fill.is-after { background-image: var(--gradient--highlight); }
.cta-block { position: relative; overflow: hidden; isolation: isolate; }
.cta-block::after { content: ""; position: absolute; left: -8rem; top: -8rem; width: 26rem; height: 26rem; border-radius: 50%; z-index: -1; border: 1px solid rgba(240,99,30,.35); box-shadow: 0 0 0 3rem rgba(240,99,30,.04), 0 0 0 6rem rgba(240,99,30,.03); pointer-events: none; }
.icon-tile svg, .icon-tile-img { width: 1.375rem; height: 1.375rem; }
@media (max-width: 767px) { .hub-ctas .btn { width: 100%; justify-content: center; } }
@media (prefers-reduced-motion: reduce) { .prob-card, .pcard { transition: none; } }

/* ===== Home batch 2: solutions + group (Builder D) ===== */
.home-tab:hover { color: var(--neutral--0); }
.home-tab.is-active { background: linear-gradient(180deg, transparent, rgba(231,67,30,.08)); }
.home-sol:hover { transform: translateY(-4px); box-shadow: 0 30px 60px -30px rgba(231,67,30,.6); }
.home-sol-more { text-decoration-color: var(--brand-primary--500); }
.home-collage > .home-collage-tile:nth-child(2), .home-collage > .home-collage-tile:nth-child(5) { margin-top: 2.5rem; }
@media (max-width: 767px) { .home-collage > .home-collage-tile:nth-child(n+4) { display: none; } }
.home-statement { font-family: var(--font--primary); }
.home-statement em { font-style: normal; font-family: var(--font--secondary); font-weight: 600; color: var(--brand-primary--400); }
.home-group-grid ~ .deco-dots, .deco-glow-wrap > .deco-dots { -webkit-mask-image: radial-gradient(ellipse at 30% 50%, #000, transparent 70%); mask-image: radial-gradient(ellipse at 30% 50%, #000, transparent 70%); }
@media (prefers-reduced-motion: reduce) { .home-sol, .home-tab { transition: none; } .home-sol:hover { transform: none; } }

/* ===== Home batch 3: why, platform + form, stats (Builder D) ===== */
.home-row:hover { background: linear-gradient(90deg, rgba(231,67,30,.06), transparent 70%); }
.home-row-media { background: radial-gradient(120% 120% at 20% 20%, rgba(231,67,30,.28), transparent 60%), repeating-linear-gradient(90deg, rgba(255,255,255,.04) 0 1px, transparent 1px 18px), linear-gradient(160deg, #1e1410, #121212); }
.home-row-media .icon-tile { width: 3.5rem; height: 3.5rem; background: rgba(12,12,12,.6); }
.home-check::before { content: ""; flex: none; margin-top: .45rem; width: .875rem; height: .5rem; border-left: 2px solid var(--brand-primary--400); border-bottom: 2px solid var(--brand-primary--400); transform: rotate(-45deg); }
.home-input::placeholder { color: var(--neutral--500); opacity: 1; }
.home-input:focus { outline: none; border-color: var(--brand-primary--400); box-shadow: 0 0 0 3px rgba(231,67,30,.2); }
.home-consent input { flex: none; width: 1rem; height: 1rem; margin-top: .15rem; accent-color: var(--brand-primary--500); }
.home-consent a { color: var(--brand-primary--400); }
.home-form .btn { justify-content: center; }
.home-stats::before { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(180deg, var(--neutral--950) 0%, rgba(12,12,12,.35) 35%, rgba(12,12,12,.55) 100%); }
.home-glass { background: rgba(22,22,22,.55); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border: 1px solid rgba(255,255,255,.12); }
.home-glass > .icon-tile { margin-bottom: auto; }
.home-glass.is-team { background: linear-gradient(160deg, rgba(195,58,32,.55), rgba(22,22,22,.6)); }
.home-glass.is-team .btn { color: #fff; }
@media (prefers-reduced-motion: reduce) { .home-row { transition: none; } }

/* ===== Home batch 4: case carousel + CTA band (Builder D) ===== */
.home-carousel { scrollbar-width: none; }
.home-carousel::-webkit-scrollbar { display: none; }
.home-carousel > * { scroll-snap-align: start; }
.home-story:hover .home-story-title { text-decoration: underline; text-underline-offset: 4px; text-decoration-color: var(--brand-primary--500); }
.home-cta { background: linear-gradient(90deg, #0c0c0c 30%, #2a120b); }
.home-cta-art { -webkit-mask-image: linear-gradient(90deg, transparent, #000 35%); mask-image: linear-gradient(90deg, transparent, #000 35%); }
.home-cta-art svg { width: 100%; height: 100%; display: block; }
@media (max-width: 991px) { .home-cta-art { -webkit-mask-image: none; mask-image: none; } }
@media (max-width: 767px) { .home-cta .btn-group { flex-direction: column; align-items: stretch; } .home-cta .btn { width: 100%; justify-content: center; } }
/* Case Card on dark (hub proof slot) */
.hub-case-slot .home-story { color: var(--neutral--0); }
.hub-case-slot .home-story-media { border-color: var(--line--subtle); }
.hub-case-slot .pill.is-on-light { color: var(--neutral--100); border-color: var(--line--mid); background: transparent; }
.hub-case-slot .home-story-title { color: var(--neutral--0); }

/* ===== Home fixes (Builder D) ===== */
.home-row-media .icon-tile-img { width: 1.875rem; height: 1.875rem; filter: brightness(1.55) saturate(1.1); }
.home-form-wrap { margin-bottom: 0; }
.home-form-msg { font-size: .9375rem; line-height: 1.5; }
.home-consent .w-checkbox-input { flex: none; margin: .15rem 0 0; }

/* ===== Resources (blog, policies, careers, 404) — Builder res-, for Global Styles ===== */
/* Filter pills: hover + current category (Webflow adds w--current to the link of the page you're on) */
.res-filter:hover { color: var(--neutral--0); border-color: var(--brand-primary--400); }
.res-filter.w--current { background: var(--neutral--0); color: var(--neutral--950); border-color: var(--neutral--0); }
/* Category chip dot */
.res-tag::before { content: ""; width: .3125rem; height: .3125rem; border-radius: 50%; background: var(--brand-primary--400); flex: none; }
/* Post card hover (cover lifts, title turns orange) */
.res-post:hover .res-post-cover { border-color: color-mix(in srgb, var(--brand-primary--500) 55%, transparent); transform: translateY(-3px); }
.res-post:hover .res-post-title { color: var(--brand-primary--300); }
.res-post:focus-visible .res-post-cover { border-color: var(--brand-primary--400); }
/* Empty CMS image fields: hide the broken <img>, keep the neutral cover box */
.res-post-cover img:not([src]), .res-post-cover img[src=""],
.res-cover img:not([src]), .res-cover img[src=""],
.res-feature-media img:not([src]), .res-feature-media img[src=""] { display: none; }
/* Article rich text */
.res-rt > :first-child { margin-top: 0; }
.res-rt h2 { font-family: var(--font--primary); font-weight: var(--font-weight--light); font-size: var(--heading--h3); line-height: var(--leading--tight); color: var(--neutral--0); margin-top: 1.5rem; }
.res-rt h3 { font-family: var(--font--secondary); font-weight: var(--font-weight--semibold); font-size: var(--text--xl); line-height: var(--leading--snug); color: var(--neutral--0); margin-top: .75rem; }
.res-rt ul, .res-rt ol { margin: 0; padding-left: 1.25rem; display: grid; gap: .5rem; }
.res-rt a { color: var(--brand-primary--300); text-underline-offset: 3px; }
.res-rt blockquote { margin: 0; border-left: 3px solid var(--brand-primary--500); padding: .25rem 0 .25rem 1.5rem; font-family: var(--font--primary); font-weight: var(--font-weight--light); font-size: var(--text--2xl); line-height: var(--leading--snug); color: var(--neutral--0); }
.res-rt figure { margin: 0; display: grid; gap: .75rem; max-width: 100%; }
.res-rt figure img { border-radius: var(--radius--2xl); width: 100%; height: auto; }
.res-rt figcaption { font-size: var(--text--sm); color: var(--neutral--400); }
.res-rt.is-light h2, .res-rt.is-light h3, .res-rt.is-light blockquote { color: var(--neutral--900); }
/* Policy rows (light section) */
.res-policy:hover .h3-style { color: var(--brand-primary--600); }
/* Roles: native details */
.res-role-sum::-webkit-details-marker { display: none; }
.res-role[open] { border-color: color-mix(in srgb, var(--brand-primary--500) 55%, transparent); }
.res-role[open] .res-role-sum .btn-chev { transform: rotate(90deg); }
/* 404 numeral: gradient text + glow */
.res-404-num { background: linear-gradient(180deg, #ee5a2a 0%, #c33a20 55%, rgba(12,12,12,.2) 100%); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0 24px rgba(240,99,30,.45)); }
/* Collection List pagination (Webflow w-pagination-*) */
.w-pagination-wrapper { justify-content: center; gap: .75rem; margin-top: var(--spacing--8); }
@media (prefers-reduced-motion: reduce) { .res-post-cover, .res-filter { transition: none; } .res-post:hover .res-post-cover { transform: none; } }

/* ===== Core pages: Solutions, Technology, About, Contact (pg-) ===== */
.pg-flow{isolation:isolate;background-image:linear-gradient(180deg,var(--neutral--900),var(--neutral--950))}
.pg-flow::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background-size:40px 40px;background-image:linear-gradient(color-mix(in srgb,var(--brand-primary--500) 8%,transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in srgb,var(--brand-primary--500) 8%,transparent) 1px,transparent 1px)}
.pg-flow-node:not(:last-child)::after{content:"";position:absolute;right:calc(-1*var(--spacing--4));top:50%;width:var(--spacing--4);height:2px;background:linear-gradient(90deg,var(--brand-primary--500),transparent)}
.pg-flow-node.is-key{box-shadow:0 0 0 1px color-mix(in srgb,var(--brand-primary--500) 30%,transparent),0 0 30px -6px var(--accent--glow-core)}
.pg-life::before{content:"";position:absolute;left:1.5rem;right:1.5rem;top:1.5rem;height:1px;background:var(--line--mid)}
